services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metromind
      POSTGRES_USER: metromind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metromind -d metromind"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      METROMIND_DATABASE_URL: postgresql+psycopg://metromind:${POSTGRES_PASSWORD}@db:5432/metromind
    ports:
      - "${METROMIND_PORT:-8000}:8000"
    volumes:
      # Drop GTFS ZIPs here to import them with: docker compose exec app python -m app.cli import /data/sources/<file>.zip
      - ./backend/data/sources:/data/sources:ro

volumes:
  pgdata:
